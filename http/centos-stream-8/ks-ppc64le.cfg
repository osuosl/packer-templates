#version=RHEL8
cdrom
lang en_US.UTF-8
keyboard us
network --bootproto=dhcp
rootpw osuadmin
firewall --disabled
selinux --enforcing
timezone UTC
# --leavebootorder stops anaconda writing the PReP partition's OF path (disk@...:1)
# to NVRAM via bootlist; correct for POWER firmware, but SLOF cannot boot it.
bootloader --location=mbr --leavebootorder
text
skipx
zerombr
clearpart --all --initlabel
part prepboot --fstype=prepboot --asprimary --size=8 --ondisk=sda
part / --fstype="ext4" --grow --size=100 --ondisk=sda
firstboot --disabled
reboot
url --url=http://centos.osuosl.org/8-stream/BaseOS/ppc64le/os/
repo --name=AppStream --baseurl=http://centos.osuosl.org/8-stream/AppStream/ppc64le/os/

%packages --ignoremissing
@^minimal-environment
openssh-clients
sudo
wget
%end

%post
yum -y upgrade
%end
