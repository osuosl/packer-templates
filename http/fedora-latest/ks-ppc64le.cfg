lang en_US.UTF-8
keyboard us
network --bootproto=dhcp
rootpw osuadmin
firewall --disabled
selinux --enforcing
timezone UTC
# --leavebootorder stops anaconda running "bootlist -m normal -o /dev/sda1", which
# writes the PReP partition's OF path (disk@...:1) to NVRAM. That is right for real
# POWER firmware but SLOF cannot boot it and drops to the OF prompt; left unset, SLOF
# finds the PReP itself via the bare disk alias.
bootloader --timeout=0 --location=mbr --leavebootorder --append="console=hvc0,115200n8 console=tty0"
text
skipx
zerombr
clearpart --all --initlabel
reqpart
part / --fstype="ext4" --grow --size=100 --ondisk=sda
firstboot --disabled
reboot --eject
url --metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=ppc64le
repo --name=updates --metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=ppc64le

%packages --exclude-weakdeps --ignoremissing
@^custom-environment
-dracut-config-rescue
-firewalld
-*firmware
# Fedora's preset enables systemd-resolved where EL's does not, and stopping it
# does not stick: it is dbus/varlink activated, so any lookup restarts it and it
# keeps resolv.conf a symlink and port 53 open. NetworkManager owns DNS here.
-systemd-resolved
dracut-config-generic
openssh-clients
# cinc's dnf_package needs python bindings and dnf5 ships none. Deliberately the
# dnf4 ones: chef 19 prefers dnf5 but its dnf5 helper matches names against
# Provides, so cleanup's "cpp" resolves to cppformat -> fmt and fails the removal.
python3-dnf
sudo
tar
wget2-wget
%end

%post
dnf -y upgrade
# Packer logs in as root and Fedora defaults to prohibit-password. Drop-ins are
# Include'd at the top of sshd_config, so they beat the appended line below.
echo "PermitRootLogin yes" > /etc/ssh/sshd_config.d/01-permitrootlogin.conf
echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
%end
