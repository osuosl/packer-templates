lang en_US.UTF-8
keyboard us
network --bootproto=dhcp
rootpw osuadmin
firewall --disabled
selinux --enforcing
timezone UTC
# --leavebootorder stops anaconda writing the PReP partition's OF path (disk@...:1)
# to NVRAM via bootlist; correct for POWER firmware, but SLOF cannot boot it.
bootloader --timeout=0 --location=mbr --leavebootorder --append="console=hvc0,115200n8 console=tty0"
text
skipx
zerombr
clearpart --all --initlabel
reqpart
part / --fstype="ext4" --grow --size=100 --ondisk=sda
firstboot --disabled
reboot --eject
url --url=https://centos-stream.osuosl.org/10-stream/BaseOS/ppc64le/os/
repo --name BaseOS --baseurl https://centos-stream.osuosl.org/10-stream/BaseOS/ppc64le/os/
repo --name AppStream --baseurl https://centos-stream.osuosl.org/10-stream/AppStream/ppc64le/os/

%packages --exclude-weakdeps --ignoremissing
@^minimal-environment
-dracut-config-rescue
-firewalld
-*firmware
dracut-config-generic
openssh-clients
sudo
tar
wget
%end

%post
yum -y upgrade
echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
%end
